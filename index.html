<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My P">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>My P – Mano parkingai</title>
<style>
:root{--green:#d8f5dc;--green-border:#65c978;--red:#ffe0e0;--red-border:#ff5555;--gray:#eceef1;--gray-border:#b9bec6;--ink:#17202b;--blue:#0878bd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.app{width:min(100%,620px);margin:0 auto;padding:12px 0 18px}
.top{display:flex;align-items:center;justify-content:center;position:relative;min-height:116px;margin:0 0 16px}
.logo{display:block;width:clamp(118px,34vw,180px);height:112px;object-fit:contain}
.add{position:absolute;right:2px;top:30px;border:0;border-radius:14px;width:48px;height:48px;background:#159b36;color:white;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 2px 5px #0002}
.table-wrap{width:100%}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:5px 7px}
col.name{width:36%} col.month{width:21.333%}
th,td{padding:0;text-align:center;vertical-align:middle}
th{font-size:clamp(11px,3.2vw,16px);font-weight:700;color:#26313d}
.headcell{background:#e9ebef;border-radius:12px;padding:10px 2px;min-height:42px;display:flex;align-items:center;justify-content:center}
th.current .headcell{background:#d9efff;color:#075b91}
.namecell{background:#eef0f3;border-radius:12px;text-align:left;padding:8px 6px;font-size:clamp(12px,3.5vw,17px);font-weight:700;overflow-wrap:anywhere;min-height:54px;display:flex;align-items:center;gap:3px}
.parking-label{flex:1;min-width:0;cursor:pointer}
.remove-parking{flex:0 0 19px;width:19px;height:23px;border:0;border-radius:6px;background:#d9dde3;color:#59616c;font-size:18px;line-height:18px;padding:0;cursor:pointer}
.entry{width:100%;height:54px;border:1.5px solid var(--gray-border);border-radius:12px;background:var(--gray);text-align:center;font-size:clamp(16px,4.8vw,22px);font-weight:700;color:#17351f;padding:2px;outline:none;min-width:0}
.entry.green{background:var(--green);border-color:var(--green-border);color:#14632a}
.entry.red{background:var(--red);border-color:var(--red-border);color:#9f2020}
.entry.gray{background:var(--gray);border-color:var(--gray-border);color:#4b5563}
.entry:focus{box-shadow:0 0 0 2px #1685ca55}
.legend{display:flex;justify-content:space-around;align-items:center;gap:6px;border-top:1px solid #d4d7dc;margin:18px 2px 0;padding-top:13px;font-size:clamp(9px,2.7vw,12px);white-space:nowrap}
.legend span{display:flex;align-items:center;gap:5px}
.swatch{width:17px;height:17px;border-radius:5px;border:1px solid}
.swatch.g{background:var(--green);border-color:var(--green-border)}
.swatch.r{background:var(--red);border-color:var(--red-border)}
.swatch.x{background:var(--gray);border-color:var(--gray-border)}
.note{text-align:center;color:#7a8490;font-size:10px;margin-top:12px}
@media(max-width:360px){
 body{padding-left:7px;padding-right:7px}
 .app{padding-top:5px}
 .top{min-height:92px;margin-bottom:8px}
 .logo{height:90px}
 .add{top:20px;width:42px;height:42px}
 table{border-spacing:3px 5px}
 .namecell{padding:6px 4px;min-height:48px}
 .remove-parking{flex-basis:17px;width:17px;height:21px;font-size:16px}
 .entry{height:48px;border-radius:9px}
 .headcell{padding:8px 1px;min-height:38px;border-radius:9px}
 .legend{margin-top:12px;padding-top:10px}
}
</style>
</head>

    <button class="add" id="addParking" aria-label="Pridėti parkingą" title="Pridėti parkingą">+</button>
  </header>
  <section class="table-wrap" aria-label="Parkingų mėnesių lentelė">
    <table>
      <colgroup><col class="name"><col class="month"><col class="month"><col class="month"></colgroup>
      <thead><tr id="monthHead"><th><div class="headcell">Parkingas</div></th></tr></thead>
      <tbody id="parkingRows"></tbody>
    </table>
  </section>
  <div class="legend">
    <span><i class="swatch g"></i>Įrašyta</span>
    <span><i class="swatch r"></i>Pradelsta</span>
    <span><i class="swatch x"></i>Laukiama</span>
  </div>
  <div class="note">Duomenys išsaugomi šiame įrenginyje.</div>
</main>
<script>
const DEFAULT_PARKINGS = ["Berž P2", "Nauj P-31", "Pastaun"];
const PARKING_KEY = "myp_parking_names_v1";
const VALUES_KEY = "myp_current_values_v1";
let parkings = load(PARKING_KEY, DEFAULT_PARKINGS);
let values = load(VALUES_KEY, {});

function load(key, fallback){
  try { const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(){
  localStorage.setItem(PARKING_KEY, JSON.stringify(parkings));
  localStorage.setItem(VALUES_KEY, JSON.stringify(values));
}
function monthData(offset){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset);
  return {year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString("lt-LT",{month:"long"}), key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
}
function stateFor(month, value){
  if(String(value ?? "").trim() !== "") return "green";
  const now=new Date();
  const target=new Date(month.year,month.month,1);
  const thisMonth=new Date(now.getFullYear(),now.getMonth(),1);
  if(target < thisMonth || (target.getTime()===thisMonth.getTime() && now.getDate()>=28)) return "red";
  return "gray";
}
function render(){
  const months=[monthData(-1),monthData(0),monthData(1)];
  const head=document.getElementById("monthHead");
  head.innerHTML='<th><div class="headcell">Parkingas</div></th>'+months.map((m,i)=>`<th class="${i===1?'current':''}"><div class="headcell">${m.label}</div></th>`).join("");
  const body=document.getElementById("parkingRows");
  body.innerHTML="";
  parkings.forEach((name,idx)=>{
    const tr=document.createElement("tr");
    const nameTd=document.createElement("td");
    const nameDiv=document.createElement("div");
    nameDiv.className="namecell";
    const label=document.createElement("span");
    label.className="parking-label";
    label.textContent=name;
    label.title="Paspauskite, jei norite pakeisti pavadinimą";
    label.addEventListener("click",()=>{
      const next=prompt("Pakeisti parkingo pavadinimą:", parkings[idx]);
      if(next===null) return;
      if(next.trim()){
        parkings[idx]=next.trim();
        save(); render();
      } else {
        alert("Pavadinimas negali būti tuščias. Jei norite pašalinti parkingą, spauskite ×.");
      }
    });
    const remove=document.createElement("button");
    remove.className="remove-parking";
    remove.type="button";
    remove.textContent="×";
    remove.title="Pašalinti parkingą";
    remove.setAttribute("aria-label",`Pašalinti ${name}`);
    remove.addEventListener("click",()=>{
      if(confirm(`Pašalinti parkingą „${parkings[idx]}“?`)){
        parkings.splice(idx,1);
        const remapped={};
        Object.entries(values).forEach(([key,val])=>{
          const [row,month]=key.split("|");
          const rowNum=Number(row);
          if(rowNum<idx) remapped[key]=val;
          else if(rowNum>idx) remapped[`${rowNum-1}|${month}`]=val;
        });
        values=remapped;
        save(); render();
      }
    });
    nameDiv.append(label,remove);
    nameTd.appendChild(nameDiv); tr.appendChild(nameTd);
    months.forEach(m=>{
      const td=document.createElement("td");
      const input=document.createElement("input");
      input.className="entry "+stateFor(m,values[`${idx}|${m.key}`]);
      input.type="text"; input.inputMode="decimal"; input.autocomplete="off";
      input.setAttribute("aria-label",`${name}, ${m.label}`);
      input.value=values[`${idx}|${m.key}`] ?? "";
      input.placeholder="";
      input.addEventListener("input",()=>{
        const k=`${idx}|${m.key}`;
        const v=input.value.trim();
        if(v==="") delete values[k]; else values[k]=v;
        save();
        input.className="entry "+stateFor(m,v);
      });
      td.appendChild(input); tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}
document.getElementById("addParking").addEventListener("click",()=>{
  const name=prompt("Įrašykite naujo parkingo pavadinimą:");
  if(name && name.trim()){
    parkings.push(name.trim());
    save(); render();
  }
});
render();
// Atidarius programėlę, mėnesių spalvos ir pavadinimai perskaičiuojami iš naujo.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
